{% extends "base.html" %}
{% block title %}Register - SkyBook{% endblock %}

{% block head %}
<style>
  main { padding: 0 !important; }
  .container { max-width: 100% !important; padding: 0 !important; }
  footer { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div style="position:absolute;top:10%;right:10%;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.12),transparent);pointer-events:none;"></div>
  <div style="position:absolute;bottom:10%;left:5%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.1),transparent);pointer-events:none;"></div>

  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo-badge">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join SkyBook and start booking flights instantly</p>

    <form method="POST" action="{{ url_for('auth.register') }}" id="register-form">
      <div class="mb-3">
        <label class="auth-form-label" for="reg-name">Full Name</label>
        <input type="text" name="name" id="reg-name" class="auth-form-control form-control" placeholder="John Doe" required autocomplete="name"/>
      </div>
      <div class="mb-3">
        <label class="auth-form-label" for="reg-email">Email Address</label>
        <input type="email" name="email" id="reg-email" class="auth-form-control form-control" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="mb-3">
        <label class="auth-form-label" for="reg-password">Password</label>
        <input type="password" name="password" id="reg-password" class="auth-form-control form-control" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password"/>
      </div>
      <div class="mb-4">
        <label class="auth-form-label" for="reg-confirm">Confirm Password</label>
        <input type="password" name="confirm_password" id="reg-confirm" class="auth-form-control form-control" placeholder="Repeat password" required autocomplete="new-password"/>
      </div>
      <button type="submit" id="register-submit-btn" class="btn-auth-submit btn">
        <i class="bi bi-person-check-fill me-2"></i>Create My Account
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-center mb-0" style="font-size:0.9rem; color:#64748b;">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" id="go-login" style="color:#6366f1; font-weight:600; text-decoration:none;">Sign In</a>
    </p>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.index') }}" style="font-size:0.83rem; color:#94a3b8; text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
