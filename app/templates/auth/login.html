{% extends "base.html" %}
{% block title %}Login - SkyBook{% endblock %}

{% block head %}
<style>
  main { padding: 0 !important; }
  .container { max-width: 100% !important; padding: 0 !important; }
  footer { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <!-- Background decorations -->
  <div style="position:absolute;top:15%;left:10%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.15),transparent);pointer-events:none;"></div>
  <div style="position:absolute;bottom:20%;right:8%;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.12),transparent);pointer-events:none;"></div>

  <div class="auth-card">
    <div class="auth-logo-badge">
      <i class="bi bi-airplane-engines-fill"></i>
    </div>
    <h1 class="auth-title">Welcome Back!</h1>
    <p class="auth-subtitle">Sign in to your SkyBook account</p>

    <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
      <div class="mb-3">
        <label class="auth-form-label" for="login-email">Email Address</label>
        <input type="email" name="email" id="login-email" class="auth-form-control form-control" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="mb-4">
        <label class="auth-form-label" for="login-password">Password</label>
        <input type="password" name="password" id="login-password" class="auth-form-control form-control" placeholder="Your password" required autocomplete="current-password"/>
      </div>
      <button type="submit" id="login-submit-btn" class="btn-auth-submit btn">
        <i class="bi bi-arrow-right-circle-fill me-2"></i>Sign In to SkyBook
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-center mb-0" style="font-size:0.9rem; color:#64748b;">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" id="go-register" style="color:#6366f1; font-weight:600; text-decoration:none;">Create one free</a>
    </p>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.index') }}" style="font-size:0.83rem; color:#94a3b8; text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
